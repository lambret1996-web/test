# ==========================================
# iOS 自动化构建流水线
# ==========================================

name: iOS 自动化流水线

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      构建模式:
        description: '选择构建模式'
        required: true
        default: '不签名构建'
        type: choice
        options:
          - 不签名构建
          - 签名打包
      构建配置:
        description: '选择 Debug 或 Release'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

env:
  项目名称: 'YourProject'                        # 【需修改】改成你的项目名
  Scheme名: 'YourProject'                        # 【需修改】改成你的 Scheme 名
  工作区文件: 'main'           # 【需修改】改成你的 .xcworkspace 或 .xcodeproj
  开发者团队ID: 'XXXXXXXXXX'                      # 【不签名时不用改】仅签名打包时需要
  签名身份: 'Apple Distribution'                  # 【不签名时不用改】仅签名打包时需要
  描述文件名称: 'YourProfileName'                  # 【不签名时不用改】仅签名打包时需要

jobs:
  # ==================== 阶段一：代码检查 + 单元测试 ====================
  代码检查与测试:
    name: 代码检查与测试
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.0.app
        # 【需修改】如果 runner 上的 Xcode 版本不同，改成对应路径

      - name: 显示环境信息
        run: |
          xcodebuild -version
          swift --version

      - name: 缓存 SPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 解析依赖
        run: xcodebuild -resolvePackageDependencies -workspace ${{ env.工作区文件 }} -scheme ${{ env.Scheme名 }}

      - name: 运行 SwiftLint 代码规范检查
        run: |
          brew install swiftlint
          swiftlint --reporter github-actions-logging

      - name: 运行单元测试
        run: |
          xcodebuild test \
            -workspace ${{ env.工作区文件 }} \
            -scheme ${{ env.Scheme名 }} \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            | xcpretty
          # 【需修改】模拟器名称按你的需求调整

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 测试结果
          path: TestResults.xcresult

  # ==================== 阶段二：不签名构建 + 导出 IPA ====================
  # 【不签名说明】
  # - 不需要证书、描述文件、Team ID
  # - 不需要配置任何 GitHub Secrets
  # - 导出的 IPA 是未签名的，不能直接安装到真机
  # - 适用于：编译验证、二次签名、内部分发测试
  不签名构建:
    name: 不签名构建并导出IPA
    needs: 代码检查与测试
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.构建模式 == '不签名构建' }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.0.app
        # 【需修改】确认 Xcode 版本路径

      - name: 缓存 SPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 解析依赖
        run: xcodebuild -resolvePackageDependencies -workspace ${{ env.工作区文件 }} -scheme ${{ env.Scheme名 }}

      # ---------- 第一步：不签名 Archive ----------
      # 【关键】使用 iphoneos SDK 编译真机架构，但禁用签名
      - name: 不签名 Archive 归档
        run: |
          xcodebuild archive \
            -workspace ${{ env.工作区文件 }} \
            -scheme ${{ env.Scheme名 }} \
            -configuration ${{ github.event.inputs.构建配置 }} \
            -archivePath ${{ github.workspace }}/build/${{ env.项目名称 }}.xcarchive \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # ---------- 第二步：从 Archive 中提取 .app 并打包成 IPA ----------
      # 【原理】IPA = zip(Payload/xxx.app)，手动组装即可
      - name: 导出未签名 IPA
        run: |
          # 创建 Payload 目录
          mkdir -p build/Payload

          # 从 xcarchive 中找到 .app 文件并复制到 Payload 目录
          APP_PATH=$(find build/${{ env.项目名称 }}.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          echo "找到 .app 文件: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/

          # 将 Payload 目录压缩为 zip，然后改名为 .ipa
          cd build
          zip -r ${{ env.项目名称 }}-unsigned.ipa Payload
          cd ..

          # 显示产物信息
          echo "========== 导出完成 =========="
          ls -lh build/${{ env.项目名称 }}-unsigned.ipa

      # ---------- 第三步：上传 IPA 产物 ----------
      - name: 上传未签名 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.项目名称 }}-未签名安装包
          path: build/${{ env.项目名称 }}-unsigned.ipa
      
